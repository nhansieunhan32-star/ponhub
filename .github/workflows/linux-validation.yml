name: PikaJieQi Linux Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact upstream source
        run: |
          git clone https://github.com/official-pikafish/Pikafish.git upstream
          cd upstream
          git checkout 7580820d52a5b17d8124e02903e655c0d0e2a628
          cd ..
          cp -a upstream baseline
          cp -a upstream guarded

      - name: Apply Root Guard patch
        run: python3 apply_engine_patch.py guarded

      - name: Build release binaries
        run: |
          make -C baseline/src -j2 build ARCH=x86-64-avx2 COMP=gcc
          make -C guarded/src -j2 build ARCH=x86-64-avx2 COMP=gcc
          cp baseline/src/PikaJieQi baseline-release
          cp guarded/src/PikaJieQi guarded-release

      - name: UCI smoke tests
        run: |
          python3 - <<'PY'
          import subprocess
          for name, exe in {'baseline':'./baseline-release','guarded':'./guarded-release'}.items():
              p = subprocess.Popen([exe], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              out, _ = p.communicate('uci\nisready\nposition startpos\ngo movetime 200\nquit\n', timeout=20)
              print(f'===== {name} =====\n{out}')
              assert p.returncode == 0 and 'uciok' in out and 'readyok' in out and 'bestmove ' in out
              if name == 'guarded':
                  assert 'option name Root Blunder Guard' in out
          PY

      - name: Built-in release benchmarks
        run: |
          ./baseline-release bench 16 1 8 default depth > baseline-bench.txt 2>&1
          ./guarded-release bench 16 1 8 default depth > guarded-bench.txt 2>&1

      - name: Build sanitizer binaries
        run: |
          make -C baseline/src clean
          make -C guarded/src clean
          make -C baseline/src -j2 build ARCH=x86-64 COMP=gcc debug=yes optimize=no sanitize='address undefined'
          make -C guarded/src -j2 build ARCH=x86-64 COMP=gcc debug=yes optimize=no sanitize='address undefined'
          mv baseline/src/PikaJieQi baseline-sanitize
          mv guarded/src/PikaJieQi guarded-sanitize

      - name: Sanitizer differential diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set +e
          printf 'uci\nisready\nposition startpos\ngo depth 6\nquit\n' | ./baseline-sanitize > baseline-sanitizer-smoke.txt 2>&1
          bs=$?
          printf 'uci\nsetoption name MultiPV value 4\nisready\nposition startpos\ngo depth 6\nquit\n' | ./baseline-sanitize > baseline-multipv4-sanitizer-smoke.txt 2>&1
          bm=$?
          printf 'uci\nisready\nposition startpos\ngo depth 6\nquit\n' | ./guarded-sanitize > guarded-sanitizer-smoke.txt 2>&1
          gs=$?
          ./baseline-sanitize bench 8 1 5 default depth > baseline-sanitizer-bench.txt 2>&1
          bb=$?
          ./guarded-sanitize bench 8 1 5 default depth > guarded-sanitizer-bench.txt 2>&1
          gb=$?
          set -e
          printf 'baseline_smoke=%s\nbaseline_multipv4_smoke=%s\nguarded_smoke=%s\nbaseline_bench=%s\nguarded_bench=%s\n' "$bs" "$bm" "$gs" "$bb" "$gb" | tee sanitizer-status.txt
          echo '===== baseline sanitizer bench tail ====='; tail -80 baseline-sanitizer-bench.txt
          echo '===== guarded sanitizer bench tail ====='; tail -80 guarded-sanitizer-bench.txt
          # Smoke paths must be clean. Bench failures are recorded for differential adjudication.
          test $bs -eq 0
          test $bm -eq 0
          test $gs -eq 0
          grep -q 'bestmove ' baseline-sanitizer-smoke.txt
          grep -q 'bestmove ' baseline-multipv4-sanitizer-smoke.txt
          grep -q 'bestmove ' guarded-sanitizer-smoke.txt

      - name: Package validation artifact
        if: always()
        run: |
          mkdir -p artifact/source artifact/bin artifact/logs
          cp baseline-release artifact/bin/PikaJieQi-7580820-baseline-linux-avx2 2>/dev/null || true
          cp guarded-release artifact/bin/PikaJieQi-7580820-rootguard-linux-avx2 2>/dev/null || true
          cp -a guarded/src artifact/source/ 2>/dev/null || true
          cp apply_engine_patch.py README.md artifact/source/
          cp *bench.txt *smoke.txt sanitizer-status.txt artifact/logs/ 2>/dev/null || true
          sha256sum artifact/bin/* > artifact/SHA256SUMS.txt 2>/dev/null || true
          echo 'base_commit=7580820d52a5b17d8124e02903e655c0d0e2a628' > artifact/VALIDATION_RESULT.txt
          echo "built_at=$(date -u +%FT%TZ)" >> artifact/VALIDATION_RESULT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikajieqi-linux-validation
          path: artifact
          retention-days: 7
