name: PikaJieQi Certified Safety Release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Verify and reconstruct final patch
        run: |
          cat exact_parts/part00 exact_parts/part01 exact_parts/part02 exact_parts/part03 exact_parts/part04 exact_parts/part05 exact_parts/part06 exact_parts/part07 > V1_TO_CERTIFIED.patch.gz.b64
          echo '55cd93fccda02150264957e738a78f8bb47b927e56aadea40835907ed4665eef  V1_TO_CERTIFIED.patch.gz.b64' | sha256sum -c -
          base64 -d V1_TO_CERTIFIED.patch.gz.b64 | gzip -dc > V1_TO_CERTIFIED.patch
          echo '3767da156b3266013c711146932902ccd3a448fd63f63360e741e99020847929  V1_TO_CERTIFIED.patch' | sha256sum -c -

      - name: Checkout exact upstream source
        run: |
          git clone https://github.com/official-pikafish/Pikafish.git upstream
          cd upstream
          git checkout 7580820d52a5b17d8124e02903e655c0d0e2a628
          test "$(git rev-parse HEAD)" = '7580820d52a5b17d8124e02903e655c0d0e2a628'
          cd ..
          cp -a upstream baseline
          cp -a upstream certified

      - name: Apply V1 and Certified Tactical Safety patches
        run: |
          python3 apply_engine_patch.py certified
          patch -d certified -p1 < V1_TO_CERTIFIED.patch
          grep -q 'Certified Tactical Safety' certified/src/ucioption.cpp
          grep -q 'certified' certified/src/search.cpp

      - name: Build Linux AVX2 release
        run: |
          make -C baseline/src -j2 build ARCH=x86-64-avx2 COMP=gcc
          make -C certified/src -j2 build ARCH=x86-64-avx2 COMP=gcc
          cp baseline/src/PikaJieQi PikaJieQi-7580820-baseline-linux-avx2
          cp certified/src/PikaJieQi PikaJieQi-7580820-certified-safety-v1-linux-avx2

      - name: Linux UCI smoke and benchmark
        run: |
          python3 - <<'PY'
          import subprocess
          engines = {
              'baseline':'./PikaJieQi-7580820-baseline-linux-avx2',
              'certified':'./PikaJieQi-7580820-certified-safety-v1-linux-avx2',
          }
          for name, exe in engines.items():
              p = subprocess.Popen([exe], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              out, _ = p.communicate('uci\nisready\nposition startpos\ngo movetime 200\nquit\n', timeout=30)
              print(f'===== {name} =====\n{out}')
              assert p.returncode == 0 and 'uciok' in out and 'readyok' in out and 'bestmove ' in out
              if name == 'certified':
                  assert 'option name Certified Tactical Safety' in out
          PY
          ./PikaJieQi-7580820-baseline-linux-avx2 bench 16 1 8 default depth > baseline-bench.txt 2>&1
          ./PikaJieQi-7580820-certified-safety-v1-linux-avx2 bench 16 1 8 default depth > certified-bench.txt 2>&1

      - name: Install MinGW and Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64 wine64

      - name: Build Windows AVX2 release
        run: |
          make -C certified/src clean
          make -C certified/src -j2 build ARCH=x86-64-avx2 COMP=mingw
          test -f certified/src/PikaJieQi.exe
          cp certified/src/PikaJieQi.exe 05-pikafish-jieqi-7580820-certified-safety-v1-avx2.exe
          file 05-pikafish-jieqi-7580820-certified-safety-v1-avx2.exe | tee windows-file.txt
          x86_64-w64-mingw32-objdump -f 05-pikafish-jieqi-7580820-certified-safety-v1-avx2.exe | tee windows-objdump.txt
          grep -qi 'pei-x86-64' windows-objdump.txt

      - name: Windows UCI smoke under Wine
        env:
          WINEDEBUG: '-all'
        run: |
          set -o pipefail
          printf 'uci\nisready\nposition startpos\ngo depth 5\nquit\n' | timeout 60s wine 05-pikafish-jieqi-7580820-certified-safety-v1-avx2.exe > windows-uci-smoke.txt 2>&1
          cat windows-uci-smoke.txt
          grep -q 'uciok' windows-uci-smoke.txt
          grep -q 'readyok' windows-uci-smoke.txt
          grep -q 'option name Certified Tactical Safety' windows-uci-smoke.txt
          grep -q 'bestmove ' windows-uci-smoke.txt

      - name: Package release artifact
        if: always()
        run: |
          mkdir -p artifact/bin artifact/source artifact/logs
          cp 05-pikafish-jieqi-7580820-certified-safety-v1-avx2.exe artifact/bin/ 2>/dev/null || true
          cp PikaJieQi-7580820-certified-safety-v1-linux-avx2 artifact/bin/ 2>/dev/null || true
          cp -a certified/src artifact/source/ 2>/dev/null || true
          cp apply_engine_patch.py V1_TO_CERTIFIED.patch README.md artifact/source/ 2>/dev/null || true
          cp baseline-bench.txt certified-bench.txt windows-file.txt windows-objdump.txt windows-uci-smoke.txt artifact/logs/ 2>/dev/null || true
          cp upstream/Copying.txt artifact/LICENSE_GPL-3.0.txt 2>/dev/null || true
          sha256sum artifact/bin/* > artifact/SHA256SUMS.txt 2>/dev/null || true
          {
            echo 'base_commit=7580820d52a5b17d8124e02903e655c0d0e2a628'
            echo 'certified_patch_sha256=3767da156b3266013c711146932902ccd3a448fd63f63360e741e99020847929'
            echo "built_at=$(date -u +%FT%TZ)"
          } > artifact/VALIDATION_RESULT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikajieqi-certified-safety-windows-avx2
          path: artifact
          retention-days: 7
