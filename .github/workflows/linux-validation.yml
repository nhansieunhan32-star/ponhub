name: PikaJieQi Linux Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact upstream source
        run: |
          git clone https://github.com/official-pikafish/Pikafish.git upstream
          cd upstream
          git checkout 7580820d52a5b17d8124e02903e655c0d0e2a628
          git rev-parse HEAD
          cd ..
          cp -a upstream baseline
          cp -a upstream guarded

      - name: Apply Root Guard patch
        run: python3 apply_engine_patch.py guarded

      - name: Build baseline Linux AVX2
        run: make -C baseline/src -j2 build ARCH=x86-64-avx2 COMP=gcc

      - name: Build guarded Linux AVX2
        run: make -C guarded/src -j2 build ARCH=x86-64-avx2 COMP=gcc

      - name: UCI smoke tests
        run: |
          python3 - <<'PY'
          import subprocess
          engines = {
              'baseline': 'baseline/src/PikaJieQi',
              'guarded': 'guarded/src/PikaJieQi',
          }
          for name, exe in engines.items():
              p = subprocess.Popen([exe], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              script = 'uci\nisready\nposition startpos\ngo movetime 200\nquit\n'
              out, _ = p.communicate(script, timeout=20)
              print(f'===== {name} =====')
              print(out)
              if p.returncode != 0 or 'uciok' not in out or 'readyok' not in out or 'bestmove ' not in out:
                  raise SystemExit(f'{name} smoke test failed')
              if name == 'guarded' and 'option name Root Blunder Guard' not in out:
                  raise SystemExit('guarded UCI options missing')
          PY

      - name: Built-in benchmark
        run: |
          baseline/src/PikaJieQi bench 16 1 8 default depth > baseline-bench.txt 2>&1
          guarded/src/PikaJieQi bench 16 1 8 default depth > guarded-bench.txt 2>&1
          tail -40 baseline-bench.txt
          tail -40 guarded-bench.txt

      - name: Build guarded with ASan and UBSan
        run: |
          make -C guarded/src clean
          make -C guarded/src -j2 build ARCH=x86-64 COMP=gcc debug=yes optimize=no sanitize='address undefined'
          mv guarded/src/PikaJieQi guarded/src/PikaJieQi-sanitize

      - name: Sanitizer smoke and bench
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set +e
          printf 'uci\nisready\nposition startpos\ngo depth 6\nquit\n' | guarded/src/PikaJieQi-sanitize > sanitizer-smoke.txt 2>&1
          smoke_status=$?
          guarded/src/PikaJieQi-sanitize bench 8 1 5 default depth > sanitizer-bench.txt 2>&1
          bench_status=$?
          set -e
          echo '===== sanitizer smoke ====='
          cat sanitizer-smoke.txt
          echo '===== sanitizer bench tail ====='
          tail -120 sanitizer-bench.txt
          test $smoke_status -eq 0
          test $bench_status -eq 0
          grep -q 'bestmove ' sanitizer-smoke.txt
          ! grep -Eqi 'AddressSanitizer|runtime error:|UndefinedBehaviorSanitizer' sanitizer-smoke.txt sanitizer-bench.txt

      - name: Restore guarded release binary
        run: |
          make -C guarded/src clean
          make -C guarded/src -j2 build ARCH=x86-64-avx2 COMP=gcc

      - name: Package validation artifact
        if: always()
        run: |
          mkdir -p artifact/source artifact/bin artifact/logs
          test -f baseline/src/PikaJieQi && cp baseline/src/PikaJieQi artifact/bin/PikaJieQi-7580820-baseline-linux-avx2 || true
          test -f guarded/src/PikaJieQi && cp guarded/src/PikaJieQi artifact/bin/PikaJieQi-7580820-rootguard-linux-avx2 || true
          test -d guarded/src && cp -a guarded/src artifact/source/ || true
          cp apply_engine_patch.py README.md artifact/source/
          cp baseline-bench.txt guarded-bench.txt sanitizer-smoke.txt sanitizer-bench.txt artifact/logs/ 2>/dev/null || true
          sha256sum artifact/bin/* > artifact/SHA256SUMS.txt 2>/dev/null || true
          {
            echo 'base_commit=7580820d52a5b17d8124e02903e655c0d0e2a628'
            echo "built_at=$(date -u +%FT%TZ)"
          } > artifact/VALIDATION_RESULT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikajieqi-linux-validation
          path: artifact
          retention-days: 7
